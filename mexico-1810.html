<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mexico 1810</title>
  <link rel="stylesheet" href="styles.css?v=4" />
</head>
<body>
  <div id="game-wrapper">
    <div id="game-root">
      <div id="screen-menu" class="screen">
        <div class="menu-greca" aria-hidden="true"></div>

        <svg class="menu-compass" viewBox="0 0 100 100" aria-hidden="true">
          <g fill="none" stroke="#5a3a1a" stroke-width="2">
            <circle cx="50" cy="50" r="34" />
            <circle cx="50" cy="50" r="25" />
            <path d="M50 4 L50 96 M4 50 L96 50 M19 19 L81 81 M81 19 L19 81" stroke-width="1" />
          </g>
          <path d="M50 8 L57 50 L50 42 L43 50 Z" fill="#5a3a1a" />
          <path d="M50 92 L43 50 L50 58 L57 50 Z" fill="#9c7a48" />
          <path d="M8 50 L50 43 L42 50 L50 57 Z" fill="#9c7a48" />
          <path d="M92 50 L50 57 L58 50 L50 43 Z" fill="#9c7a48" />
          <circle cx="50" cy="50" r="4" fill="#5a3a1a" />
          <text x="50" y="21" text-anchor="middle" font-family="Georgia, serif"
                font-size="13" font-weight="700" fill="#5a3a1a">N</text>
        </svg>

        <div class="menu-content">
          <h1 class="menu-title">México<span class="menu-title-sub">&mdash; 1810 &mdash;</span></h1>
          <nav class="menu-buttons">
            <button id="menu-new-game" class="menu-btn" type="button">New Game</button>
            <button id="menu-minigame-1" class="menu-btn" type="button">Minigame&nbsp;#1 &mdash; Spikey Adventure</button>
            <button id="menu-minigame-2" class="menu-btn" type="button">Minigame&nbsp;#2 &mdash; Bandits and Other Things</button>
          </nav>
        </div>
      </div>

      <div id="screen-intro" class="screen hidden">
        <div id="intro-text"></div>
        <div class="intro-button-row">
          <button id="intro-button" class="pixel-btn" type="button"></button>
        </div>
      </div>

      <div id="screen-map" class="screen hidden">
        <canvas id="game-canvas" width="160" height="144"></canvas>
        <div id="map-labels"></div>
        <div id="dialogue-overlay" class="screen hidden">
          <div id="dialogue-box" class="dialogue-box">
            <div id="dialogue-speaker"></div>
            <div id="dialogue-text"></div>
            <div id="dialogue-choices" class="hidden"></div>
            <form id="dialogue-input-form" class="hidden">
              <input id="dialogue-input-field" type="text" autocomplete="off" />
              <button class="pixel-btn" type="submit">say</button>
            </form>
            <div id="dialogue-continue" class="hidden"></div>
          </div>
        </div>
      </div>

      <div id="screen-road" class="screen hidden">
        <canvas id="road-canvas" width="160" height="144"></canvas>
        <div id="road-lose-overlay" class="screen hidden">
          <div class="road-lose-box">
            <div id="road-lose-text"></div>
            <button id="road-try-again-button" class="pixel-btn" type="button">try again</button>
          </div>
        </div>
      </div>

      <div id="screen-gameover" class="screen hidden">
        <button id="play-again-button" class="pixel-btn" type="button">play again</button>
      </div>
    </div>

    <div id="dpad" class="hidden">
      <button id="dpad-up" class="dpad-btn dpad-up" type="button" aria-label="Move up">&#9650;</button>
      <button id="dpad-left" class="dpad-btn dpad-left" type="button" aria-label="Move left">&#9664;</button>
      <button id="dpad-right" class="dpad-btn dpad-right" type="button" aria-label="Move right">&#9654;</button>
      <button id="dpad-down" class="dpad-btn dpad-down" type="button" aria-label="Move down">&#9660;</button>
    </div>

    <div id="road-controls" class="hidden">
      <div class="road-lane-btns">
        <button id="road-up" class="dpad-btn" type="button" aria-label="Move up">&#9650;</button>
        <button id="road-down" class="dpad-btn" type="button" aria-label="Move down">&#9660;</button>
      </div>
      <div class="road-action-btns">
        <button id="road-shoot" class="pixel-btn road-action-btn" type="button">shoot</button>
        <button id="road-jump" class="pixel-btn road-action-btn" type="button">jump</button>
      </div>
    </div>
  </div>

  <script src="js/state.js?v=25"></script>
  <script src="js/dialogueData.js?v=25"></script>
  <script src="js/dialogueEngine.js?v=25"></script>
  <script src="js/intro.js?v=25"></script>
  <script src="js/map.js?v=25"></script>
  <script src="js/roadgame.js?v=25"></script>
  <script src="js/nightroadgame.js?v=25"></script>
  <script src="js/main.js?v=25"></script>
</body>
</html>
