<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mexico 1810</title>
  <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
  <div id="game-wrapper">
    <div id="game-root">
      <div id="screen-intro" class="screen">
        <div id="intro-text"></div>
        <div class="intro-button-row">
          <button id="intro-button" class="pixel-btn" type="button"></button>
        </div>
      </div>

      <div id="screen-map" class="screen hidden">
        <canvas id="game-canvas" width="160" height="144"></canvas>
        <div id="map-labels"></div>
        <div id="dialogue-overlay" class="screen hidden">
          <div class="dialogue-box">
            <div id="dialogue-speaker"></div>
            <div id="dialogue-text"></div>
            <div id="dialogue-choices" class="hidden"></div>
            <form id="dialogue-input-form" class="hidden">
              <input id="dialogue-input-field" type="text" autocomplete="off" />
              <button class="pixel-btn" type="submit">say</button>
            </form>
            <div id="dialogue-continue" class="hidden"></div>
          </div>
        </div>
      </div>

      <div id="screen-gameover" class="screen hidden">
        <button id="play-again-button" class="pixel-btn" type="button">play again</button>
      </div>
    </div>

    <div id="dpad" class="hidden">
      <button id="dpad-up" class="dpad-btn dpad-up" type="button" aria-label="Move up">&#9650;</button>
      <button id="dpad-left" class="dpad-btn dpad-left" type="button" aria-label="Move left">&#9664;</button>
      <button id="dpad-right" class="dpad-btn dpad-right" type="button" aria-label="Move right">&#9654;</button>
      <button id="dpad-down" class="dpad-btn dpad-down" type="button" aria-label="Move down">&#9660;</button>
    </div>
  </div>

  <script src="js/state.js?v=14"></script>
  <script src="js/dialogueData.js?v=14"></script>
  <script src="js/dialogueEngine.js?v=14"></script>
  <script src="js/intro.js?v=14"></script>
  <script src="js/map.js?v=14"></script>
  <script src="js/main.js?v=14"></script>
</body>
</html>
